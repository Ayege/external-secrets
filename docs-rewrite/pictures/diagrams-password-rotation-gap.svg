<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 660" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif" fill="#1f2328">
  <title id="title">How password rotation breaks a hand-copied Kubernetes Secret and how ESO keeps it current</title>
  <desc id="desc">Three rows show a secret manager, a Kubernetes cluster holding a Kubernetes Secret and an app, and a database. Before rotation, a hand-copied password-1 matches everywhere and login succeeds. After rotation, the secret manager and database hold password-2 but the cluster still holds password-1, so login fails. With ESO, ESO checks the secret manager on a schedule and updates the Kubernetes Secret to password-2, so login succeeds after the app restarts or reloads the value.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="1060" height="660" fill="#ffffff"/>

  <!-- Before rotation -->
  <g transform="translate(0 34)">
    <text x="10" y="0" font-size="18" font-weight="700">Before rotation: every copy matches</text>

    <rect x="285" y="46" width="565" height="130" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="297" y="67" font-size="14" font-style="italic">Kubernetes cluster</text>

    <g fill="#ffffff" stroke="#1f2328" stroke-width="1.5">
      <rect x="10" y="78" width="150" height="82"/>
      <rect x="480" y="78" width="165" height="82"/>
      <rect x="725" y="78" width="110" height="82"/>
      <rect x="945" y="78" width="105" height="82"/>
    </g>

    <g text-anchor="middle" font-size="16" font-weight="700">
      <text x="85" y="112">Secret manager</text>
      <text x="562.5" y="112">Kubernetes Secret</text>
      <text x="780" y="112">App</text>
      <text x="997.5" y="112">Database</text>
    </g>
    <g text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace">
      <text x="85" y="138">password-1</text>
      <text x="562.5" y="138">password-1</text>
      <text x="780" y="138">password-1</text>
      <text x="997.5" y="138">password-1</text>
    </g>

    <g stroke="#1f2328" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <line x1="160" y1="119" x2="480" y2="119"/>
      <line x1="645" y1="119" x2="725" y2="119"/>
      <line x1="835" y1="119" x2="945" y2="119"/>
    </g>
    <g text-anchor="middle" font-size="15">
      <text x="222" y="110">copied by hand</text>
      <text x="685" y="92">read at</text>
      <text x="685" y="110">start</text>
      <text x="897" y="110">login OK</text>
    </g>
  </g>

  <!-- After rotation -->
  <g transform="translate(0 246)">
    <text x="10" y="0" font-size="18" font-weight="700">After rotation: the cluster still holds the old password</text>

    <path d="M85 78 V30 H997.5 V78" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="541" y="23" text-anchor="middle" font-size="15">rotates the password</text>

    <rect x="285" y="46" width="565" height="130" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="297" y="67" font-size="14" font-style="italic">Kubernetes cluster</text>

    <g fill="#ffffff" stroke="#1f2328" stroke-width="1.5">
      <rect x="10" y="78" width="150" height="82"/>
      <rect x="945" y="78" width="105" height="82"/>
    </g>
    <g fill="#fdecea" stroke="#c62828" stroke-width="2">
      <rect x="480" y="78" width="165" height="82"/>
      <rect x="725" y="78" width="110" height="82"/>
    </g>

    <g text-anchor="middle" font-size="16" font-weight="700">
      <text x="85" y="112">Secret manager</text>
      <text x="562.5" y="112">Kubernetes Secret</text>
      <text x="780" y="112">App</text>
      <text x="997.5" y="112">Database</text>
    </g>
    <g text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace">
      <text x="85" y="138">password-2</text>
      <text x="562.5" y="138" fill="#b71c1c">password-1</text>
      <text x="780" y="138" fill="#b71c1c">password-1</text>
      <text x="997.5" y="138">password-2</text>
    </g>

    <line x1="160" y1="119" x2="430" y2="119" stroke="#c62828" stroke-width="2" stroke-dasharray="7 5"/>
    <g stroke="#c62828" stroke-width="3" stroke-linecap="round">
      <line x1="436" y1="110" x2="454" y2="128"/>
      <line x1="454" y1="110" x2="436" y2="128"/>
    </g>
    <line x1="645" y1="119" x2="725" y2="119" stroke="#1f2328" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="835" y1="119" x2="945" y2="119" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)"/>

    <g text-anchor="middle" font-size="15">
      <text x="222" y="92" fill="#b71c1c">new value</text>
      <text x="222" y="110" fill="#b71c1c">not copied</text>
      <text x="685" y="92">read at</text>
      <text x="685" y="110">start</text>
      <text x="897" y="110" fill="#b71c1c" font-weight="700">login fails</text>
    </g>
  </g>

  <!-- With ESO -->
  <g transform="translate(0 458)">
    <text x="10" y="0" font-size="18" font-weight="700">After rotation with ESO: the cluster gets the new password</text>

    <path d="M85 78 V30 H997.5 V78" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="541" y="23" text-anchor="middle" font-size="15">rotates the password</text>

    <rect x="285" y="46" width="565" height="130" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="297" y="67" font-size="14" font-style="italic">Kubernetes cluster</text>

    <g fill="#ffffff" stroke="#1f2328" stroke-width="1.5">
      <rect x="10" y="78" width="150" height="82"/>
      <rect x="480" y="78" width="165" height="82"/>
      <rect x="725" y="78" width="110" height="82"/>
      <rect x="945" y="78" width="105" height="82"/>
    </g>
    <rect x="300" y="78" width="105" height="82" fill="#326ce5" stroke="#1f4fb4" stroke-width="1.5"/>

    <g text-anchor="middle" font-size="16" font-weight="700">
      <text x="85" y="112">Secret manager</text>
      <text x="352.5" y="125" fill="#ffffff" font-size="20">ESO</text>
      <text x="562.5" y="112">Kubernetes Secret</text>
      <text x="780" y="112">App</text>
      <text x="997.5" y="112">Database</text>
    </g>
    <g text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace">
      <text x="85" y="138">password-2</text>
      <text x="562.5" y="138">password-2</text>
      <text x="780" y="138">password-2</text>
      <text x="997.5" y="138">password-2</text>
    </g>

    <g stroke="#1f2328" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <line x1="300" y1="119" x2="160" y2="119"/>
      <line x1="405" y1="119" x2="480" y2="119"/>
      <line x1="645" y1="119" x2="725" y2="119"/>
      <line x1="835" y1="119" x2="945" y2="119"/>
    </g>
    <g text-anchor="middle" font-size="15">
      <text x="222" y="92">checks on</text>
      <text x="222" y="110">a schedule</text>
      <text x="442.5" y="110">updates</text>
      <text x="685" y="92">restart</text>
      <text x="685" y="110">or reload</text>
      <text x="897" y="110">login OK</text>
    </g>
  </g>
</svg>
